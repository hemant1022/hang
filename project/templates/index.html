{% extends "layout.html" %}
{% block content %}
    <div class="row">
        <div class="col-12 text-center mb-4">
            <h1>Our Products</h1>
        </div>
    </div>
    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description }}</p>
                    <h6 class="card-subtitle mb-2 text-muted">${{ '%.2f'|format(product.price) }}</h6>
                    <div class="mt-auto">
                        <a href="{{ url_for('main.product', product_id=product.id) }}" class="btn btn-secondary">View Details</a>
                        <a href="{{ url_for('main.add_to_cart', product_id=product.id) }}" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
