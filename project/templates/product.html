{% extends "layout.html" %}
{% block content %}
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-body">
                    <h1 class="card-title">{{ product.name }}</h1>
                    <p class="card-text">{{ product.description }}</p>
                    <h3 class="card-text text-primary">${{ '%.2f'|format(product.price) }}</h3>
                    <hr>
                    <a href="{{ url_for('main.add_to_cart', product_id=product.id) }}" class="btn btn-success">Add to Cart</a>
                    <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Back to Products</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
